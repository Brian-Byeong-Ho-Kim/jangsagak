name: Deploy Jangsagak preview
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jangsagak-preview
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.BASELINE_VERIFIED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check recovered baseline
        run: |
          test -s dist/index.html
          test -f docs/baseline-verified.md
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=jangsagak --branch=github-preview
